<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="stylesheet" href="play.css">
<title>Snake</title>
</head>
<body>
<div id="hud"></div>
<canvas id="c"></canvas>
<p class="hint">Arrow keys, WASD or swipe. Space pauses. Best score is saved.</p>
<script src="save.js"></script>
<script>
const N = 20, c = document.getElementById('c'), x = c.getContext('2d'), hud = document.getElementById('hud'), st = store('snake');
let best = Number(st.get({}).best) || 0, s, d, nd, f, score, dead, paused, size = 400;
function place() { do f = { x: Math.random() * N | 0, y: Math.random() * N | 0 }; while (s.some(p => p.x == f.x && p.y == f.y)); }
function reset() { s = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }]; d = nd = { x: 1, y: 0 }; score = 0; dead = paused = false; place(); draw(); }
function end() { dead = true; if (score > best) { best = score; st.set({ best }); } }
function step() {
  if (dead || paused) return;
  d = nd;
  const h = { x: s[0].x + d.x, y: s[0].y + d.y };
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || s.some(p => p.x == h.x && p.y == h.y)) end();
  else { s.unshift(h); if (h.x == f.x && h.y == f.y) { score++; s.length == N * N ? end() : place(); } else s.pop(); }
  draw();
}
function draw() {
  const u = size / N;
  x.fillStyle = '#15171b'; x.fillRect(0, 0, size, size);
  x.fillStyle = '#f2777a'; x.beginPath(); x.arc((f.x + .5) * u, (f.y + .5) * u, u * .38, 0, 7); x.fill();
  s.forEach((p, i) => { x.fillStyle = i ? '#6fa3ef' : '#b9d4ff'; x.fillRect(p.x * u + 1, p.y * u + 1, u - 2, u - 2); });
  if (dead || paused) {
    x.fillStyle = '#0c0d11cc'; x.fillRect(0, 0, size, size);
    x.fillStyle = '#e8eaee'; x.textAlign = 'center'; x.font = '600 ' + u * .9 + 'px system-ui';
    x.fillText(dead ? 'Game over. Tap or press a key' : 'Paused', size / 2, size / 2);
  }
  hud.textContent = 'Score ' + score + '  ·  Best ' + Math.max(best, score);
}
function turn(dx, dy) { if (dead) return reset(); paused = false; if (dx != -d.x || dy != -d.y) nd = { x: dx, y: dy }; }
function fit() { size = Math.max(200, Math.floor(Math.min(innerWidth - 24, innerHeight - 120) / N) * N); c.width = c.height = size; draw(); }
const keys = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
addEventListener('keydown', e => {
  const k = keys[e.key.length == 1 ? e.key.toLowerCase() : e.key];
  if (k) { e.preventDefault(); turn(k[0], k[1]); }
  else if (e.key == ' ') { e.preventDefault(); dead ? reset() : (paused = !paused, draw()); }
});
let t0;
addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
addEventListener('touchend', e => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
});
c.addEventListener('click', () => { if (dead) reset(); else if (paused) { paused = false; draw(); } });
addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => { if (document.hidden && !dead) { paused = true; draw(); } });
reset(); fit(); setInterval(step, 110);
</script>
</body>
</html>
