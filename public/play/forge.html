<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="stylesheet" href="play.css">
<title>Star Forge</title>
</head>
<body>
<div id="hud"></div>
<button id="hit" aria-label="Forge a star">⭐</button>
<div class="row" id="shop"></div>
<p class="hint">Tap the star, buy upgrades. Progress saves automatically and keeps earning for up to 8 hours while you are away.</p>
<script src="save.js"></script>
<script>
const U = [['🔨 Hammer', 15, 1, 0], ['🧑 Apprentice', 50, 0, 1], ['🔥 Furnace', 400, 0, 8], ['⚛️ Reactor', 5000, 0, 60], ['🌌 Nebula', 60000, 0, 500]];
const st = store('forge'), hud = document.getElementById('hud'), shop = document.getElementById('shop');
const raw = st.get({}) || {}, num = v => Number.isFinite(v) && v > 0 ? v : 0;
const g = { stars: num(raw.stars), lv: U.map((_, i) => Math.floor(num(raw.lv && raw.lv[i]))), last: num(raw.last) || Date.now() };
const sum = k => U.reduce((n, u, i) => n + u[k] * g.lv[i], 0), cost = i => Math.ceil(U[i][1] * Math.pow(1.15, g.lv[i]));
const fmt = n => n < 1e6 ? Math.floor(n).toLocaleString() : n.toExponential(2);
g.stars += sum(3) * Math.min(Math.max(0, Date.now() - g.last) / 1000, 28800);
const save = () => { g.last = Date.now(); st.set(g); };
function draw() {
  hud.textContent = fmt(g.stars) + ' stars  ·  ' + fmt(1 + sum(2)) + ' per tap  ·  ' + fmt(sum(3)) + ' per second';
  U.forEach((u, i) => { const b = shop.children[i]; b.textContent = u[0] + ' (' + g.lv[i] + ')  ·  ' + fmt(cost(i)); b.disabled = g.stars < cost(i); });
}
U.forEach((u, i) => { const b = document.createElement('button'); b.onclick = () => { const c = cost(i); if (g.stars >= c) { g.stars -= c; g.lv[i]++; save(); draw(); } }; shop.append(b); });
document.getElementById('hit').onclick = () => { g.stars += 1 + sum(2); draw(); };
let prev = Date.now();
setInterval(() => { const now = Date.now(); g.stars += sum(3) * Math.min((now - prev) / 1000, 28800); prev = now; draw(); }, 250);
setInterval(save, 3000);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', save);
draw();
</script>
</body>
</html>
