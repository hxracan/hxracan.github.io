<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="stylesheet" href="play.css">
<title>Mines</title>
</head>
<body>
<div id="hud"></div>
<div class="grid" id="g"></div>
<div class="row"><button id="flag">🚩 Flag mode</button><button id="new">New board</button></div>
<p class="hint">Tap to reveal. Right-click or flag mode to mark. The board saves after every move.</p>
<script src="save.js"></script>
<script>
const W = 10, M = 15, st = store('mines'), el = document.getElementById('g'), hud = document.getElementById('hud'), fb = document.getElementById('flag');
const fresh = best => ({ cells: Array.from({ length: W * W }, () => ({ m: 0, r: 0, f: 0, n: 0 })), placed: false, over: false, won: false, secs: 0, best });
let g = st.get(null), flag = false;
if (!g || !Array.isArray(g.cells) || g.cells.length != W * W || g.cells.some(c => !c || typeof c != 'object')) g = fresh(0);
const near = i => { const x = i % W, y = i / W | 0, o = []; for (let b = -1; b < 2; b++) for (let a = -1; a < 2; a++) { const u = x + a, v = y + b; if ((a || b) && u >= 0 && v >= 0 && u < W && v < W) o.push(v * W + u); } return o; };
function plant(safe) {
  const keep = new Set([safe, ...near(safe)]);
  for (let n = 0; n < M;) { const i = Math.random() * W * W | 0; if (!keep.has(i) && !g.cells[i].m) { g.cells[i].m = 1; n++; } }
  g.cells.forEach((c, i) => c.n = near(i).filter(j => g.cells[j].m).length);
  g.placed = true;
}
function reveal(i) {
  const c = g.cells[i];
  if (c.r || c.f) return;
  c.r = 1;
  if (c.m) { g.over = true; g.cells.forEach(k => { if (k.m) k.r = 1; }); }
  else if (!c.n) near(i).forEach(reveal);
}
function act(i, mark) {
  if (g.over) return;
  const c = g.cells[i];
  if (mark) { if (!c.r) c.f ^= 1; }
  else { if (!g.placed) plant(i); reveal(i); }
  if (!g.over && g.cells.every(k => k.r || k.m)) { g.over = g.won = true; if (!g.best || g.secs < g.best) g.best = g.secs; }
  st.set(g); draw();
}
const tint = ['', '#8db7fa', '#7fd49b', '#f2777a', '#c59bf5', '#f5b56b', '#6fd3d3', '#e8eaee', '#8b919c'];
function draw() {
  g.cells.forEach((c, i) => {
    const b = el.children[i];
    b.className = c.r ? 'open' : '';
    b.textContent = c.r ? (c.m ? '💥' : c.n || '') : c.f ? '🚩' : '';
    b.style.color = tint[c.n] || '';
  });
  hud.textContent = (g.won ? 'Cleared! ' : g.over ? 'Boom. ' : '') + '⏱ ' + g.secs + 's  ·  🚩 ' + (M - g.cells.filter(c => c.f).length) + (g.best ? '  ·  Best ' + g.best + 's' : '');
}
el.style.gridTemplateColumns = 'repeat(' + W + ',1fr)';
for (let i = 0; i < W * W; i++) {
  const b = document.createElement('button');
  b.setAttribute('aria-label', 'Cell ' + (i + 1));
  b.onclick = () => act(i, flag);
  b.oncontextmenu = e => { e.preventDefault(); act(i, true); };
  el.append(b);
}
fb.onclick = () => { flag = !flag; fb.className = flag ? 'on' : ''; };
document.getElementById('new').onclick = () => { g = fresh(g.best); st.set(g); draw(); };
setInterval(() => { if (g.placed && !g.over && !document.hidden) { g.secs++; st.set(g); draw(); } }, 1000);
draw();
</script>
</body>
</html>
